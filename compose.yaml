services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env
      
    environment:
      DATA_DIR: /app/data

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./data:/app/data

  n8n:
    image: n8nio/n8n:latest

    ports:
      - "127.0.0.1:5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      - api

volumes:
  n8n_data: